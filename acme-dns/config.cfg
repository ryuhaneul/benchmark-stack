[general]
listen = ":53"
protocol = "both"
domain = "auth.example.org"
nsname = "auth.example.org"
nsadmin = "admin.example.org"
records = [
    "auth.example.org. A 192.0.2.1",
    "auth.example.org. NS ns1.example.org."
]

[database]
engine = "sqlite3"
connection = "/var/lib/acme-dns/acme-dns.db"

[api]
ip = "0.0.0.0"
port = "8080"
tls = "none"
corsorigins = ["*"]

[logconfig]
loglevel = "info"
logtype = "stdout"
logformat = "text"
